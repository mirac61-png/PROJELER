<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bize Katılın</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Bize Katılın</h1>
        <p>Mars projemize sen de katıl!</p>
    </header>

    <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="galeri.html">Galeri</a>
        <a href="basvuru.html">Bize Katılın</a>
    </nav>

    <main>
        <section class="form-alani">
            <h2>Başvuru Formu</h2>

            <form>
                <label for="ad">Adınız:</label>
                <input type="text" id="ad" name="ad" placeholder="Adınızı girin">

                <label for="soyad">Soyadınız:</label>
                <input type="text" id="soyad" name="soyad" placeholder="Soyadınızı girin">

                <label for="email">E-posta:</label>
                <input type="email" id="email" name="email" placeholder="E-posta adresiniz">

                <label for="mesaj">Neden Mars'ı keşfetmek istiyorsunuz?</label>
                <textarea id="mesaj" name="mesaj" rows="5" placeholder="Mesajınızı yazın"></textarea>

                <button type="submit">Başvuruyu Gönder</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Mars Projesi</p>
    </footer>

</body>
</html>
