<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garajım | SiberGaraj</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-light">

    <!-- ÜST MENÜ -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-warning">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning fs-3" href="index.html">
                <i class="fa-solid fa-car-side"></i> SİBER<span class="text-white">GARAJ</span>
            </a>
            <div class="navbar-nav ms-auto align-items-center">
                <a class="nav-link" href="index.html"><i class="fa-solid fa-arrow-left"></i> Vitrine Dön</a>
                <a class="nav-link" href="rezervasyon.html"><i class="fa-solid fa-file-contract"></i> Kiralama Şartları & Onay</a>
                <a class="btn btn-warning fw-bold ms-3" href="garajim.html">
                    <i class="fa-solid fa-warehouse"></i> Garajım 
                    <span id="garajSayaci" class="badge bg-danger ms-1">0</span>
                </a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row">
            <!-- SOL SÜTUN (8 Birim): BOOTSTRAP TABLOSU (Kitap Sayfa 152) -->
            <div class="col-lg-8">
                <h3 class="mb-4"><i class="fa-solid fa-clipboard-list text-warning"></i> Kiralama Listem</h3>
                
                <div class="table-responsive">
                    <table class="table table-dark table-striped table-hover table-bordered align-middle text-center">
                        <thead class="table-warning text-dark">
                            <tr>
                                <th>Görsel</th>
                                <th>Araç Modeli</th>
                                <th>Günlük Ücret</th>
                                <th>Kiralama Günü</th>
                                <th>Ara Toplam</th>
                                <th>İptal</th>
                            </tr>
                        </thead>
                        <tbody id="garajTabloGovdesi">
                            <!-- JS İLE DOLDURULACAK -->
                        </tbody>
                    </table>
                </div>
                <button onclick="garajiTemizle()" class="btn btn-outline-danger btn-sm mt-2">
                    <i class="fa-solid fa-trash-can"></i> Tüm Garajı Boşalt
                </button>
            </div>

            <!-- SAĞ SÜTUN (4 Birim): ÖZET VE İNDİRİM KUPONU KARTI -->
            <div class="col-lg-4 mt-4 mt-lg-0">
                <div class="card bg-black text-light border-warning">
                    <div class="card-header bg-warning text-dark fw-bold fs-5">
                        <i class="fa-solid fa-calculator"></i> Kira Özeti
                    </div>
                    <div class="card-body">
                        <div class="input-group mb-3">
                            <input type="text" id="kuponInput" class="form-control bg-dark text-light border-secondary" placeholder="İndirim Kodu (VIPGARAJ20)">
                            <button onclick="kuponUygula()" class="btn btn-outline-warning">Uygula</button>
                        </div>
                        <div id="kuponMesaj"></div>
                        <hr class="border-secondary">
                        <div class="d-flex justify-content-between fs-5 mb-3">
                            <span>Toplam Tutar:</span>
                              <strong id="genelToplamText" class="text-success fs-3">$0</strong>
                        </div>
                        <a href="rezervasyon.html" class="btn btn-success w-100 fw-bold py-2 fs-5">
                            Sözleşmeye Geç <i class="fa-solid fa-chevron-right"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
