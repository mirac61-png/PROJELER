<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#172033">
    <title>Mini Oyunlar | Proje 6</title>
    <style>
        :root {
            font-family: "Segoe UI", Arial, sans-serif;
            color: #f4f7fb;
            background: #172033;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            background: radial-gradient(ellipse at 15% 0, #293d60, transparent 50%), #172033;
        }

        main {
            width: min(900px, 100%);
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            text-align: center;
        }

        .eyebrow {
            color: #67dfc0;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 10px 0;
            font-size: clamp(2.2rem, 6vw, 3.4rem);
        }

        header p:last-child {
            color: #bdc8d8;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr));
            gap: 16px;
        }

        .game {
            display: flex;
            min-height: 180px;
            flex-direction: column;
            justify-content: space-between;
            padding: 23px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.06);
            text-decoration: none;
            transition: transform 160ms ease, border-color 160ms ease;
        }

        .game:hover,
        .game:focus-visible {
            transform: translateY(-3px);
            border-color: #67dfc0;
            outline: none;
        }

        .icon {
            font-size: 2rem;
        }

        h2 {
            margin: 16px 0 7px;
            font-size: 1.2rem;
        }

        .game p {
            margin: 0;
            color: #bdc8d8;
            line-height: 1.55;
        }

        .back {
            display: inline-block;
            margin-top: 28px;
            color: #67dfc0;
            font-weight: 700;
            text-decoration: none;
        }

        .back:hover,
        .back:focus-visible {
            text-decoration: underline;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <p class="eyebrow">Proje 6</p>
            <h1>Mini Oyunlar</h1>
            <p>Oynamak istediğin oyunu seç.</p>
        </header>

        <nav class="games" aria-label="Oyunlar">
            <a class="game" href="oyun1.html">
                <span class="icon" aria-hidden="true">✊</span>
                <span>
                    <h2>Taş - Kağıt - Makas</h2>
                    <p>Bilgisayara karşı hamleni seç.</p>
                </span>
            </a>
            <a class="game" href="oyun2.html">
                <span class="icon" aria-hidden="true">🔢</span>
                <span>
                    <h2>Sayı Tahmin Oyunu</h2>
                    <p>1 ile 100 arasındaki sayıyı bul.</p>
                </span>
            </a>
            <a class="game" href="oyun3.html">
                <span class="icon" aria-hidden="true">⚡</span>
                <span>
                    <h2>Hızlı Tıklama</h2>
                    <p>10 saniyede en yüksek skorunu yap.</p>
                </span>
            </a>
        </nav>

        <a class="back" href="../">&larr; Ana sayfaya dön</a>
    </main>
</body>
</html>
