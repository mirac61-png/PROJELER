<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hızlı Tıklama Oyunu</title>
    <style>
        body {
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-card {
            background-color: #34495e;
            border: 2px solid #1abc9c;
            border-radius: 15px;
            padding: 30px;
            width: 400px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        h1 { color: #1abc9c; margin-top: 0; }
        .click-btn {
            background-color: #e67e22;
            border: none;
            color: white;
            padding: 20px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin: 15px 0;
            transition: transform 0.1s;
        }
        .click-btn:active { transform: scale(0.95); }
        .stats { font-size: 1.1rem; margin: 10px 0; }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            color: #1abc9c;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="game-card">
    <h1>Hızlı Tıklama Oyunu</h1>
    <p>10 saniye içinde tıklayabildiğin kadar tıkla!</p>
    
    <div class="stats">Kalan Süre: <span id="time" style="color:#e67e22;">10</span> sn</div>
    <div class="stats">Skor: <span id="score" style="color:#1abc9c;">0</span></div>

    <button id="clickBtn" class="click-btn" onclick="handleClick()">BAŞLA / TIKLA!</button>

    <div id="resultMessage"></div>
    <a href="index.html" class="back-btn">← Oyunlara Dön</a>
</div>

<script>
    let clicks = 0;
    let timeLeft = 10;
    let timer = null;
    let gameStarted = false;

    function handleClick() {
        if (!gameStarted) {
            gameStarted = true;
            clicks = 1;
            document.getElementById('score').innerText = clicks;
            document.getElementById('resultMessage').innerText = "";
            
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('time').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    document.getElementById('clickBtn').disabled = true;
                    document.getElementById('resultMessage').innerText = `Oyun bitti! Toplam Skorun: ${clicks}`;
                }
            }, 1000);
        } else if (timeLeft > 0) {
            clicks++;
            document.getElementById('score').innerText = clicks;
        }
    }
</script>

</body>
</html>
